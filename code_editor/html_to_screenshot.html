
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro HTML Renderer & Capture Tool</title>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b0f19',
                        glassBg: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
            background-attachment: fixed;
            color: #f8fafc;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glassBg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glassBorder);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Drag and drop active state */
        .drag-active {
            border-color: #6366f1 !important;
            background: rgba(99, 102, 241, 0.1) !important;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col font-sans">

    <!-- Header -->
    <header class="glass-panel rounded-2xl p-5 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="scan-line" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">CodeCapture Pro</h1>
                <p class="text-sm text-gray-400">Render HTML files & export HD screenshots instantly</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
             <button onclick="renderPreview()" class="px-5 py-2.5 rounded-xl font-medium text-white bg-white/10 hover:bg-white/20 border border-white/10 transition-all flex items-center gap-2 active:scale-95 text-sm">
                <i data-lucide="play" class="w-4 h-4"></i>
                Render Code
            </button>
            <button id="capture-btn" onclick="takeHighQualityScreenshot()" class="px-5 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 transition-all shadow-lg shadow-emerald-500/20 flex items-center gap-2 active:scale-95 text-sm disabled:opacity-70 disabled:cursor-wait disabled:scale-100">
                <i id="capture-icon" data-lucide="download" class="w-4 h-4"></i>
                <i id="loading-icon" data-lucide="loader-2" class="w-4 h-4 spinner hidden"></i>
                <span id="capture-text">Download HD</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 h-[calc(100vh-140px)] min-h-[600px]">
        
        <!-- Left: Input Controls -->
        <section class="flex flex-col gap-4 h-full">
            
            <!-- Drag & Drop Upload Zone -->
            <div id="drop-zone" class="glass-panel rounded-2xl p-8 border-2 border-dashed border-gray-600 hover:border-indigo-400 transition-colors flex flex-col items-center justify-center gap-3 cursor-pointer group text-center" onclick="document.getElementById('file-upload').click()">
                <div class="w-12 h-12 rounded-full bg-indigo-500/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <i data-lucide="file-code-2" class="w-6 h-6 text-indigo-400"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-200">Upload HTML File</h3>
                    <p class="text-xs text-gray-500 mt-1">Drag & drop or click to browse (Only .html allowed)</p>
                </div>
                <input type="file" id="file-upload" accept=".html" class="hidden" onchange="handleFileSelect(event)">
            </div>

            <!-- Code Editor Textarea -->
            <div class="glass-panel rounded-2xl flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-white/5 bg-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="code" class="w-4 h-4 text-indigo-400"></i>
                        <h2 class="text-sm font-medium text-gray-300">Manual Code Editor</h2>
                    </div>
                    <button onclick="clearCode()" class="text-xs text-gray-500 hover:text-red-400 transition-colors flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-3 h-3"></i> Clear
                    </button>
                </div>
                <textarea id="code-input" class="w-full h-full p-4 bg-transparent border-none text-sm font-mono text-gray-300 focus:outline-none resize-none placeholder-gray-600 leading-relaxed" placeholder="<html>&#10;  <body>&#10;    <h1>Hello World</h1>&#10;  </body>&#10;</html>"></textarea>
            </div>
        </section>

        <!-- Right: Live Preview -->
        <section class="glass-panel rounded-2xl flex flex-col overflow-hidden h-full">
            <div class="px-4 py-3 border-b border-white/5 bg-white/5 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="layout" class="w-4 h-4 text-emerald-400"></i>
                    <h2 class="text-sm font-medium text-gray-300">Live Render Preview</h2>
                </div>
                <div class="flex items-center gap-1.5 text-xs text-gray-500">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live
                </div>
            </div>
            
            <div class="flex-1 p-4 bg-black/40 overflow-auto relative rounded-b-2xl" id="iframe-container">
                <!-- Empty State -->
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 pointer-events-none z-10">
                    <i data-lucide="monitor-x" class="w-10 h-10 mb-2 opacity-50"></i>
                    <p class="text-sm">No code to preview yet</p>
                </div>

                <!-- Iframe wrapper for accurate height expansion -->
                <div class="w-full bg-white rounded-lg overflow-hidden shadow-2xl relative transition-all mx-auto min-h-full" id="iframe-wrapper">
                    <!-- The iframe background is explicitly set to white so output is clear -->
                    <iframe id="preview-frame" class="w-full h-full border-none bg-white opacity-0 transition-opacity duration-300 absolute inset-0"></iframe>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const codeInput = document.getElementById('code-input');
        const iframe = document.getElementById('preview-frame');
        const iframeWrapper = document.getElementById('iframe-wrapper');
        const emptyState = document.getElementById('empty-state');

        // Initial Demo content
        const initialHTML = `<!DOCTYPE html>
<html>
<head>
<style>
  body { 
    font-family: 'Inter', sans-serif; 
    margin: 0; padding: 40px; 
    background: #f8fafc; color: #0f172a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: white; padding: 40px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 500px;
  }
  h1 { font-size: 28px; margin-bottom: 10px; color: #4f46e5; }
  p { line-height: 1.6; color: #64748b; margin-bottom: 20px; }
  .badge { background: #e0e7ff; color: #4338ca; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;}
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Success</span>
    <h1>Ready for Capture</h1>
    <p>Upload a .html file or type your code on the left. Once rendered, click the <b>Download HD</b> button to capture a 3x resolution screenshot of this entire frame.</p>
  </div>
</body>
</html>`;

        // Set initial state
        codeInput.value = initialHTML;
        setTimeout(renderPreview, 100);

        // Drag and Drop Logic
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }, false);

        function handleFileSelect(e) {
            handleFiles(e.target.files);
            // Reset input so same file can be uploaded again if needed
            e.target.value = '';
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            // Validate File Type
            if (!file.name.toLowerCase().endsWith('.html') && file.type !== 'text/html') {
                alert('Please upload a valid .html file.');
                return;
            }

            // Read File
            const reader = new FileReader();
            reader.onload = (e) => {
                codeInput.value = e.target.result;
                renderPreview();
            };
            reader.readAsText(file);
        }

        function clearCode() {
            codeInput.value = '';
            renderPreview();
        }

        // Render HTML to Iframe
        function renderPreview() {
            const code = codeInput.value;
            const doc = iframe.contentWindow.document;
            
            if (code.trim() === '') {
                iframe.style.opacity = '0';
                emptyState.style.display = 'flex';
                return;
            }

            doc.open();
            doc.write(code);
            doc.close();

            emptyState.style.display = 'none';
            iframe.style.opacity = '1';
        }

        // Advanced Screenshot Capture Logic
        async function takeHighQualityScreenshot() {
            const doc = iframe.contentWindow.document;
            if (!doc.body || doc.body.innerHTML.trim() === '') {
                alert("Nothing to capture. Please render some HTML first.");
                return;
            }

            const btn = document.getElementById('capture-btn');
            const captureIcon = document.getElementById('capture-icon');
            const loadingIcon = document.getElementById('loading-icon');
            const captureText = document.getElementById('capture-text');

            // Set Loading UI
            btn.disabled = true;
            captureIcon.classList.add('hidden');
            loadingIcon.classList.remove('hidden');
            captureText.innerText = "Processing...";

            try {
                // 1. Calculate Full Height of Content
                const body = doc.body;
                const html = doc.documentElement;
                
                // Get the absolute max height the content requires
                const fullHeight = Math.max(
                    body.scrollHeight, body.offsetHeight,
                    html.clientHeight, html.scrollHeight, html.offsetHeight
                );

                // 2. Setup styles temporarily to allow full rendering
                // Remove absolute positioning momentarily so wrapper dictates height
                iframe.style.position = 'relative'; 
                iframeWrapper.style.height = `${fullHeight}px`;
                iframe.style.height = `${fullHeight}px`;

                // Give browser time to repaint the expanded iframe
                await new Promise(r => setTimeout(r, 400));

                // 3. Capture with html2canvas (Scale 3 for HD)
                const canvas = await html2canvas(body, {
                    scale: 3, 
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: window.getComputedStyle(body).backgroundColor || '#ffffff',
                    windowHeight: fullHeight // Inform html2canvas of the true height
                });

                // 4. Restore original styles
                iframe.style.position = 'absolute';
                iframeWrapper.style.height = 'auto';
                iframe.style.height = '100%';

                // 5. Download the image
                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `HD_Render_${new Date().getTime()}.png`;
                link.href = imgData;
                link.click();

            } catch (error) {
                console.error("Capture Error:", error);
                alert("An error occurred while generating the screenshot.");
                // Restore styles in case of error
                iframe.style.position = 'absolute';
                iframeWrapper.style.height = 'auto';
                iframe.style.height = '100%';
            } finally {
                // Restore Button UI
                btn.disabled = false;
                captureIcon.classList.remove('hidden');
                loadingIcon.classList.add('hidden');
                captureText.innerText = "Download HD";
            }
        }
    </script>
</body>
</html>
